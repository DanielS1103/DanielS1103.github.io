<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Macintosh Pixel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Caveat:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --scene-1: #6f9ab8;
        --scene-2: #4c6f8f;
        --key: #d7cba9;
        --key-dark: #a99872;
        --screen-mint: #dff2e4;
        --screen-mint-deep: #c9e9d9;
        --screen-text: #0c3a2f;
        --screen-dark: #0c2f28;
        --screen-frame: #241f14;
        --pixel-font: "VT323", monospace;
        --script-font: "Caveat", cursive;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: transparent;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        font-family: var(--pixel-font);
        image-rendering: pixelated;
      }

      /* ============ SCENE WRAP — responsive scale ============ */
      .scene-wrap {
        transform-origin: top center;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .stage {
        position: relative;
        width: 470px;
        height: 370px; /* mac body only */
        user-select: none;
        flex-shrink: 0;
      }
      svg {
        display: block;
      }

      /* ============ MAC CASE ============ */
      .mac-unit {
        position: absolute;
        left: 0;
        top: 0;
        width: 470px;
        height: 400px;
      }
      .case-side {
        position: absolute;
        left: 335px;
        top: 18px;
        width: 120px;
        height: 336px;
      }
      .case-side .vents {
        position: absolute;
        right: 20px;
        bottom: 44px;
        display: grid;
        grid-template-columns: repeat(3, 10px);
        gap: 6px;
        z-index: 2;
      }
      .case-side .vents span {
        height: 6px;
        background: #3a3122;
      }
      .case-front {
        position: absolute;
        left: 0;
        top: 0;
        width: 360px;
        height: 360px;
      }
      .screen-bezel {
        position: absolute;
        left: 30px;
        top: 30px;
        width: 300px;
        height: 228px;
        padding: 18px;
      }
      .bezel-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .crt {
        position: relative;
        width: 264px;
        height: 192px;
        background: var(--screen-dark);
        overflow: hidden;
        cursor: pointer;
        border: 3px solid var(--screen-frame);
        clip-path: polygon(
          8px 0,
          calc(100% - 8px) 0,
          100% 8px,
          100% calc(100% - 8px),
          calc(100% - 8px) 100%,
          8px 100%,
          0 calc(100% - 8px),
          0 8px
        );
      }
      .crt-glare {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.16) 0%,
          rgba(255, 255, 255, 0.16) 18%,
          transparent 18%
        );
        pointer-events: none;
        z-index: 50;
      }
      .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          rgba(0, 0, 0, 0) 0,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.14) 3px
        );
        pointer-events: none;
        z-index: 49;
      }
      .apple-badge {
        position: absolute;
        left: 34px;
        top: 272px;
        width: 26px;
        height: 26px;
        z-index: 2;
      }
      .floppy-slot {
        position: absolute;
        left: 118px;
        top: 288px;
        width: 114px;
        height: 10px;
        background: #3a3122;
        z-index: 2;
      }
      .floppy-slot span {
        position: absolute;
        top: 3px;
        left: 8px;
        right: 8px;
        height: 2px;
        background: #000;
        opacity: 0.4;
      }
      .brand-label {
        position: absolute;
        left: 34px;
        top: 305px;
        font-family: var(--script-font);
        font-size: 19px;
        color: #5c4f36;
        letter-spacing: 0.5px;
        z-index: 2;
      }
      .power-btn {
        position: absolute;
        left: 262px;
        top: 306px;
        width: 36px;
        height: 16px;
        background: #c3b587;
        border: 2px solid #5c4f36;
        border-radius: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--pixel-font);
        font-size: 11px;
        color: #40371f;
        padding: 0;
        z-index: 2;
      }
      .power-btn:active {
        transform: translate(1px, 1px);
      }
      .power-led {
        position: absolute;
        left: 306px;
        top: 308px;
        width: 12px;
        height: 12px;
        z-index: 2;
      }
      .mac-base {
        position: absolute;
        left: 4px;
        top: 346px;
        width: 352px;
        height: 14px;
        background: #5c4f36;
        z-index: 1;
      }

      /* ============ KEYBOARD ============ */
      .keyboard {
        position: absolute;
        left: 20px;
        top: 400px;
        width: 420px;
        height: 96px;
      }
      .keyboard-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .kb-keys {
        position: absolute;
        left: 14px;
        top: 12px;
        right: 14px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 1;
      }
      .kb-row {
        display: flex;
        gap: 5px;
      }
      .key {
        height: 14px;
        flex: 1;
        background: var(--key);
        box-shadow: 2px 2px 0 var(--key-dark);
      }
      .key.wide {
        flex: 2.4;
      }
      .key.space {
        flex: 8;
      }

      /* ============ MOUSE ============ */
      .mouse-wrap {
        position: absolute;
        left: 460px;
        top: 440px;
        width: 96px;
        height: 78px;
      }
      .mouse-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .mouse-seam {
        position: absolute;
        left: 10px;
        top: 16px;
        right: 10px;
        height: 4px;
        background: #8d7f5c;
        z-index: 1;
      }

      /* ============ SCREEN CONTENT LAYERS ============ */
      .layer {
        position: absolute;
        inset: 0;
      }
      .off-screen {
        background: radial-gradient(
          ellipse at 50% 40%,
          #163530 0%,
          #041210 70%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1f5c4d;
        font-size: 13px;
        letter-spacing: 1px;
        opacity: 1;
        transition: opacity 0.25s;
      }
      .boot-screen {
        background: var(--screen-mint);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .boot-screen.show {
        opacity: 1;
      }
      .boot-icon {
        width: 52px;
        height: 52px;
      }
      .boot-bar {
        width: 140px;
        height: 10px;
        border: 2px solid var(--screen-text);
        overflow: hidden;
        background: rgba(12, 58, 47, 0.08);
      }
      .boot-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--screen-text);
        transition: width 1.2s linear;
      }
      .hello-screen {
        background: var(--screen-mint);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s;
      }
      .hello-screen.show {
        opacity: 1;
      }
      #helloCanvas {
        width: 230px;
        height: 90px;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
      .desktop-layer {
        background: var(--screen-mint);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s;
        display: flex;
        flex-direction: column;
      }
      .desktop-layer.show {
        opacity: 1;
        pointer-events: auto;
      }
      .menubar {
        height: 18px;
        background: #f2f8f4;
        border-bottom: 2px solid var(--screen-text);
        display: flex;
        align-items: center;
        padding: 0 5px;
        gap: 2px;
        position: relative;
        z-index: 100;
        flex-shrink: 0;
      }
      .menu-apple {
        width: 12px;
        height: 12px;
        cursor: pointer;
        margin-right: 4px;
      }
      .menu-item {
        font-size: 12px;
        color: var(--screen-text);
        padding: 0 6px;
        cursor: pointer;
        line-height: 16px;
      }
      .menu-item:hover,
      .menu-item.active {
        background: var(--screen-text);
        color: var(--screen-mint);
      }
      .menu-clock {
        margin-left: auto;
        font-size: 11px;
        color: var(--screen-text);
        padding-right: 3px;
      }
      .menu-dropdown {
        position: absolute;
        top: 18px;
        left: 0;
        min-width: 130px;
        background: #f2f8f4;
        border: 2px solid var(--screen-text);
        border-top: none;
        display: none;
        flex-direction: column;
        z-index: 200;
        box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.2);
      }
      .menu-dropdown.open {
        display: flex;
      }
      .menu-dropdown div {
        font-size: 12px;
        color: var(--screen-text);
        padding: 2px 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      .menu-dropdown div:hover {
        background: var(--screen-text);
        color: var(--screen-mint);
      }
      .menu-dropdown hr {
        border: none;
        border-top: 1px solid var(--screen-text);
        opacity: 0.35;
        margin: 2px 0;
      }

      /* ============ DESKTOP ============ */
      .desktop-icons {
        position: relative;
        flex: 1;
        padding: 10px;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 4px;
        overflow: hidden;
      }
      .desk-icon {
        width: 52px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        cursor: default;
        padding: 2px;
      }
      .desk-icon .glyph {
        width: 28px;
        height: 28px;
      }
      .desk-icon .lbl {
        font-size: 11px;
        color: var(--screen-text);
        text-align: center;
        line-height: 1;
        padding: 1px 2px;
      }
      .desk-icon.selected .lbl {
        background: var(--screen-text);
        color: var(--screen-mint);
      }

      /* ============ WINDOWS ============ */
      #windows-layer {
        position: absolute;
        left: 0;
        top: 18px;
        right: 0;
        bottom: 0;
        z-index: 150;
        pointer-events: none;
      }
      .win {
        position: absolute;
        background: var(--screen-mint);
        border: 2px solid var(--screen-text);
        box-shadow: 3px 4px 0 rgba(12, 58, 47, 0.35);
        display: flex;
        flex-direction: column;
        pointer-events: auto;
        animation: winPop 0.12s ease-out;
      }
      @keyframes winPop {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .win-titlebar {
        height: 18px;
        flex-shrink: 0;
        background-image: repeating-linear-gradient(
          to bottom,
          var(--screen-text) 0 2px,
          var(--screen-mint) 2px 4px
        );
        border-bottom: 2px solid var(--screen-text);
        display: flex;
        align-items: center;
        padding: 0 4px;
        cursor: grab;
        gap: 5px;
      }
      .win-titlebar:active {
        cursor: grabbing;
      }
      .win-close {
        width: 10px;
        height: 10px;
        background: var(--screen-mint);
        border: 2px solid var(--screen-text);
        cursor: pointer;
        flex-shrink: 0;
      }
      .win-title {
        background: var(--screen-mint);
        padding: 0 7px;
        font-size: 11px;
        color: var(--screen-text);
        margin: 0 auto;
      }
      .win-body {
        flex: 1;
        overflow: auto;
        padding: 9px;
        font-size: 13px;
        color: var(--screen-text);
        line-height: 1.35;
      }
      .win-body b {
        font-weight: 700;
      }
      .mini-icon-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .mini-icon {
        width: 54px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        cursor: default;
      }
      .mini-icon .lbl {
        font-size: 11px;
        text-align: center;
      }

      /* ============ PIXELPAINT ============ */
      .paint-toolbar {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 6px;
      }
      .swatch {
        width: 14px;
        height: 14px;
        border: 2px solid var(--screen-text);
        cursor: pointer;
      }
      .swatch.active {
        outline: 2px solid #d9534f;
        outline-offset: 1px;
      }
      .paint-btn {
        font-family: var(--pixel-font);
        font-size: 12px;
        border: 2px solid var(--screen-text);
        background: var(--screen-mint);
        color: var(--screen-text);
        cursor: pointer;
        padding: 1px 7px;
      }
      .paint-btn:hover {
        background: var(--screen-text);
        color: var(--screen-mint);
      }
      .paint-grid {
        display: grid;
        border: 2px solid var(--screen-text);
        width: max-content;
      }
      .paint-cell {
        width: 9px;
        height: 9px;
        background: #fff;
        outline: 1px solid #cfe6da;
      }

      /* ============ PONG ============ */
      .pong-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        height: 100%;
        padding: 4px;
      }
      .pong-canvas {
        display: block;
        image-rendering: pixelated;
        border: 2px solid var(--screen-text);
        background: var(--screen-dark);
        cursor: none;
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      .pong-ui {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 13px;
        color: var(--screen-text);
        flex-shrink: 0;
      }
      .pong-btn {
        font-family: var(--pixel-font);
        font-size: 12px;
        border: 2px solid var(--screen-text);
        background: var(--screen-mint);
        color: var(--screen-text);
        cursor: pointer;
        padding: 1px 8px;
      }
      .pong-btn:hover {
        background: var(--screen-text);
        color: var(--screen-mint);
      }
      .pong-touch-controls {
        display: none;
        flex-direction: row;
        gap: 8px;
        flex-shrink: 0;
      }
      .pong-touch-btn {
        font-family: var(--pixel-font);
        font-size: 18px;
        border: 2px solid var(--screen-text);
        background: var(--screen-mint);
        color: var(--screen-text);
        cursor: pointer;
        width: 36px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .pong-touch-btn:active {
        background: var(--screen-text);
        color: var(--screen-mint);
      }

      /* show touch controls on touch devices */
      @media (pointer: coarse) {
        .pong-touch-controls {
          display: flex;
        }
        .pong-canvas {
          cursor: default;
        }
      }

      /* ============ SCROLLBAR ============ */
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--screen-text);
      }
      ::-webkit-scrollbar-track {
        background: var(--screen-mint-deep);
      }
    </style>
  </head>
  <body>
    <div class="scene-wrap" id="sceneWrap">
      <div class="stage">
        <!-- MAC -->
        <div class="mac-unit">
          <div class="case-side" id="caseSide">
            <div class="vents">
              <span></span><span></span><span></span> <span></span><span></span
              ><span></span>
            </div>
          </div>
          <div class="case-front" id="caseFront">
            <div class="screen-bezel">
              <div class="bezel-bg" id="bezelBg"></div>
              <div class="crt" id="crt" title="Clic para encender">
                <div class="layer off-screen" id="offScreen">
                  ● screen off ●
                </div>
                <div class="layer boot-screen" id="bootScreen">
                  <div class="boot-icon" id="bootIcon"></div>
                  <div class="boot-bar">
                    <div class="boot-bar-fill" id="bootBarFill"></div>
                  </div>
                </div>
                <div class="layer hello-screen" id="helloScreen">
                  <canvas id="helloCanvas" width="140" height="55"></canvas>
                </div>
                <div class="layer desktop-layer" id="desktopLayer">
                  <div class="menubar" id="menubar">
                    <div class="menu-apple" id="menuApple"></div>
                    <div class="menu-item" data-menu="file">File</div>
                    <div class="menu-item" data-menu="edit">Edit</div>
                    <div class="menu-item" data-menu="special">Special</div>
                    <div class="menu-clock" id="menuClock">12:00</div>
                    <div class="menu-dropdown" id="dd-apple">
                      <div data-action="about">About This Mac…</div>
                    </div>
                    <div class="menu-dropdown" id="dd-file">
                      <div data-action="newfolder">New folder</div>
                      <div data-action="closeall">Close All</div>
                    </div>
                    <div class="menu-dropdown" id="dd-edit">
                      <div data-action="noop">Copy</div>
                      <div data-action="noop">Paste</div>
                    </div>
                    <div class="menu-dropdown" id="dd-special">
                      <div data-action="emptytrash">Empty Trash</div>
                      <hr />
                      <div data-action="restart">Restart</div>
                      <div data-action="shutdown">Shut Down</div>
                    </div>
                  </div>
                  <div class="desktop-icons" id="desktopIcons"></div>
                </div>
                <div id="windows-layer"></div>
                <div class="crt-glare"></div>
                <div class="scanlines"></div>
              </div>
            </div>
            <div class="apple-badge" id="appleBadge"></div>
            <div class="floppy-slot"><span></span></div>
            <div class="brand-label">Macintosh</div>
            <button class="power-btn" id="powerBtn">⏻</button>
            <div class="power-led" id="powerLed"></div>
            <div class="mac-base"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ============================================================
         PIXEL ART ENGINE
      ============================================================ */
      function pixelIcon(rows, palette) {
        const w = Math.max(...rows.map((r) => r.length));
        const h = rows.length;
        const norm = rows.map((r) => (r + ".".repeat(w)).slice(0, w));
        let rects = "";
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const c = norm[y][x];
            if (c === ".") continue;
            const color = palette[c];
            if (!color) continue;
            rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${color}"/>`;
          }
        return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
      }

      function pixelPanel(cols, rows, opts) {
        const {
          corner = 4,
          outline = "#000",
          light = "#fff",
          base = "#ccc",
          dark = "#888",
          lightBand = 0.28,
          darkBand = 0.24,
        } = opts;
        function inShape(x, y) {
          if (x < 0 || y < 0 || x >= cols || y >= rows) return false;
          const r = corner;
          let cx = null,
            cy = null;
          if (x < r && y < r) {
            cx = r - 1;
            cy = r - 1;
          } else if (x >= cols - r && y < r) {
            cx = cols - r;
            cy = r - 1;
          } else if (x < r && y >= rows - r) {
            cx = r - 1;
            cy = rows - r;
          } else if (x >= cols - r && y >= rows - r) {
            cx = cols - r;
            cy = rows - r;
          }
          if (cx === null) return true;
          const dx = x - cx,
            dy = y - cy;
          return dx * dx + dy * dy <= r * r + r;
        }
        let rects = "";
        for (let y = 0; y < rows; y++)
          for (let x = 0; x < cols; x++) {
            if (!inShape(x, y)) continue;
            const isEdge =
              !inShape(x - 1, y) ||
              !inShape(x + 1, y) ||
              !inShape(x, y - 1) ||
              !inShape(x, y + 1);
            let color;
            if (isEdge) {
              color = outline;
            } else {
              const t = (x / cols) * 0.5 + (y / rows) * 0.5;
              color = t < lightBand ? light : t > 1 - darkBand ? dark : base;
            }
            rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${color}"/>`;
          }
        return `<svg viewBox="0 0 ${cols} ${rows}" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
      }

      /* ============ ICONS ============ */
      const ICONS = {};
      ICONS.disk = pixelIcon(
        [
          "............",
          "............",
          "..kkkkkkkk..",
          ".kwwwwwwwwk.",
          ".kwwwwwwwwk.",
          ".kwkkkkkkwk.",
          ".kwwwwwwwwk.",
          ".kwwwwwwwwk.",
          ".kwwwwwwwwk.",
          ".kkkkkkkkkk.",
          "............",
          "............",
        ],
        { k: "#3a4a48", w: "#eef6f1" },
      );
      ICONS.folder = pixelIcon(
        [
          "............",
          "...kkkk.....",
          "..kyyyk.....",
          ".kkkkkkkkkk.",
          ".kyyyyyyyyk.",
          ".kyyyyyyyyk.",
          ".kyyyyyyyyk.",

      function drawHello() {
        try {
          const c = document.getElementById("helloCanvas");
          if (!c) return;
          const ctx = c.getContext("2d");
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.fillStyle = "#0c3a2f";
          ctx.font = "italic 40px 'Caveat', cursive";
          ctx.textBaseline = "middle";
          ctx.textAlign = "center";
          ctx.fillText("hello", c.width / 2, c.height / 2 + 4);
        } catch (e) {
          console.warn("canvas error", e);
        }
      }
      try {
        if (document.fonts && document.fonts.ready) {
          document.fonts
            .load("40px 'Caveat'")
            .then(drawHello)
            .catch(() => {});
          document.fonts.ready.then(drawHello).catch(() => {});
        } else {
          drawHello();
        }
      } catch (e) {}

      function closeAllWindows() {

      function focusWindow(el) {

      function openWindow({ id, title, x, y, w, h, content, onReady }) {
        if (document.getElementById(id)) {
          focusWindow(document.getElementById(id));
          return;
        }
        // Center window in the available layer area
        const layerRect = winLayer.getBoundingClientRect();
        const layerW = layerRect.width || 264;
        const layerH = layerRect.height || 174;
        const cx = Math.max(2, Math.round((layerW - w) / 2));
        const cy = Math.max(2, Math.round((layerH - h) / 2));
        const finalX = x !== undefined ? cx : cx;
        const finalY = y !== undefined ? cy : cy;
        const win = document.createElement("div");
        win.className = "win";
        win.id = id;
        win.style.cssText = `left:${cx}px;top:${cy}px;width:${w}px;height:${h}px;z-index:${++zTop}`;
        win.innerHTML = `
          <div class="win-titlebar">
            <div class="win-close"></div>
            <div class="win-title">${title}</div>
          </div>
          <div class="win-body">${content}</div>`;
        winLayer.appendChild(win);
        openWins[id] = true;
        win.addEventListener("mousedown", () => focusWindow(win));
        win.querySelector(".win-close").addEventListener("click", (e) => {
          e.stopPropagation();
          win.remove();
          delete openWins[id];
        });
        makeDraggable(win, win.querySelector(".win-titlebar"));
        if (onReady) onReady(win);
        return win;
      }

      function makeDraggable(win, handle) {
        let dragging = false,
          offX = 0,
          offY = 0;
        // mouse
        handle.addEventListener("mousedown", (e) => {
          if (e.target.classList.contains("win-close")) return;
          dragging = true;
          const rect = win.getBoundingClientRect();
          offX = e.clientX - rect.left;
          offY = e.clientY - rect.top;
          focusWindow(win);
          e.preventDefault();
        });
        window.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          const pr = winLayer.getBoundingClientRect();
          let nx = e.clientX - pr.left - offX;
          let ny = e.clientY - pr.top - offY;
          nx = Math.max(0, Math.min(nx, pr.width - win.offsetWidth));
          ny = Math.max(0, Math.min(ny, pr.height - win.offsetHeight));
          win.style.left = nx + "px";
          win.style.top = ny + "px";
        });
        window.addEventListener("mouseup", () => (dragging = false));
        // touch
        handle.addEventListener(
          "touchstart",
          (e) => {
            if (e.target.classList.contains("win-close")) return;
            const t = e.touches[0];
            dragging = true;
            const rect = win.getBoundingClientRect();
            offX = t.clientX - rect.left;
            offY = t.clientY - rect.top;
            focusWindow(win);
            e.preventDefault();
          },
          { passive: false },
        );
        handle.addEventListener(
          "touchmove",
          (e) => {
            if (!dragging) return;
            const t = e.touches[0];
            const pr = winLayer.getBoundingClientRect();
            let nx = t.clientX - pr.left - offX;
            let ny = t.clientY - pr.top - offY;
            nx = Math.max(0, Math.min(nx, pr.width - win.offsetWidth));
            ny = Math.max(0, Math.min(ny, pr.height - win.offsetHeight));
            win.style.left = nx + "px";
            win.style.top = ny + "px";
            e.preventDefault();
          },
          { passive: false },
        );
        handle.addEventListener("touchend", () => (dragging = false));
      }

                touchDown = true;
                e.preventDefault();
              },
              { passive: false },
            );
            downBtn.addEventListener("touchend", () => (touchDown = false));
            downBtn.addEventListener("mousedown", () => (touchDown = true));
            downBtn.addEventListener("mouseup", () => (touchDown = false));

            // Mouse / touch control on canvas
            canvas.addEventListener("mousemove", (e) => {
              const rect = canvas.getBoundingClientRect();
              const scaleY = canvas.height / rect.height;
              p1Y = (e.clientY - rect.top) * scaleY - padH / 2;
            });
            canvas.addEventListener(
              "touchmove",
              (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleY = canvas.height / rect.height;
                p1Y = (e.touches[0].clientY - rect.top) * scaleY - padH / 2;
                e.preventDefault();
              },
              { passive: false },
            );

            // Listen on both document and the canvas to capture keys in iframe
            function onKeyDown(e) {
              keys[e.key] = true;
            }
            function onKeyUp(e) {
              keys[e.key] = false;
            }
            document.addEventListener("keydown", onKeyDown);
            document.addEventListener("keyup", onKeyUp);
            // Also make canvas focusable so arrow keys work
            canvas.setAttribute("tabindex", "0");
            canvas.addEventListener("click", () => canvas.focus());
            canvas.addEventListener("keydown", onKeyDown);
            canvas.addEventListener("keyup", onKeyUp);

            function initGame() {
              cW = canvas.width;
              cH = canvas.height;
              ballR = Math.max(3, Math.round(cW * 0.025));
              padH = Math.round(cH * 0.28);
              padSpeed = Math.round(cH * 0.045);
              ballX = cW / 2;
              ballY = cH / 2;
              const spd = cW * 0.025;
              const ang = ((Math.random() * 60 - 30) * Math.PI) / 180;
              ballDX = (Math.random() > 0.5 ? 1 : -1) * spd * Math.cos(ang);
              ballDY = spd * Math.sin(ang);
              p1Y = cH / 2 - padH / 2;
              p2Y = cH / 2 - padH / 2;
            }

            function resetBall() {
              ballX = cW / 2;
              ballY = cH / 2;
              const spd = cW * 0.025;
              const ang = ((Math.random() * 60 - 30) * Math.PI) / 180;
              ballDX = (Math.random() > 0.5 ? 1 : -1) * spd * Math.cos(ang);
              ballDY = spd * Math.sin(ang);
            }

            function updateScore() {
              scoreEl.textContent = score1 + " — " + score2;
            }

            function aiMove() {
              const center = p2Y + padH / 2;
              const speed = padSpeed * 0.72;
              if (center < ballY - 4) p2Y = Math.min(p2Y + speed, cH - padH);
              else if (center > ballY + 4) p2Y = Math.max(p2Y - speed, 0);
            }

            function playerMove() {
              if (
                (keys["ArrowUp"] || keys["w"] || keys["W"] || touchUp) &&
                p1Y > 0
              )
                p1Y = Math.max(0, p1Y - padSpeed);
              if (
                (keys["ArrowDown"] || keys["s"] || keys["S"] || touchDown) &&
                p1Y < cH - padH
              )
                p1Y = Math.min(cH - padH, p1Y + padSpeed);
            }

            function draw() {
              ctx.fillStyle = "#041210";
              ctx.fillRect(0, 0, cW, cH);

              // dashed center line
              ctx.setLineDash([4, 6]);
              ctx.strokeStyle = "#1f5c4d";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(cW / 2, 0);
              ctx.lineTo(cW / 2, cH);
              ctx.stroke();
              ctx.setLineDash([]);

              // scores on screen
              ctx.fillStyle = "#2a7a60";
              ctx.font = `${Math.round(cH * 0.18)}px 'VT323', monospace`;
              ctx.textAlign = "center";
              ctx.fillText(score1, cW * 0.28, cH * 0.22);
              ctx.fillText(score2, cW * 0.72, cH * 0.22);

              // paddles
              ctx.fillStyle = "#dff2e4";
              ctx.fillRect(PAD_GAP, p1Y, PAD_W, padH);
              ctx.fillRect(cW - PAD_GAP - PAD_W, p2Y, PAD_W, padH);

              // ball (pixel square)
              ctx.fillRect(
                Math.round(ballX - ballR),
                Math.round(ballY - ballR),
                ballR * 2,
                ballR * 2,
              );
            }

            function loop() {
              cW = canvas.width;
              cH = canvas.height;

              playerMove();
              aiMove();

              ballX += ballDX;
              ballY += ballDY;

              // top / bottom bounce
              if (ballY - ballR <= 0) {
                ballY = ballR;
                ballDY = Math.abs(ballDY);
              }
              if (ballY + ballR >= cH) {
                ballY = cH - ballR;
                ballDY = -Math.abs(ballDY);
              }

              // paddle collision p1 (left)
              if (
                ballX - ballR <= PAD_GAP + PAD_W &&
                ballY >= p1Y &&
                ballY <= p1Y + padH &&
                ballDX < 0
              ) {
                ballX = PAD_GAP + PAD_W + ballR;
                const rel = (ballY - (p1Y + padH / 2)) / (padH / 2);
                const spd = Math.sqrt(ballDX * ballDX + ballDY * ballDY) * 1.04;
                const ang = (rel * 60 * Math.PI) / 180;
                ballDX = Math.abs(spd * Math.cos(ang));
                ballDY = spd * Math.sin(ang);
              }
              // paddle collision p2 (right)
              if (
                ballX + ballR >= cW - PAD_GAP - PAD_W &&
                ballY >= p2Y &&
                ballY <= p2Y + padH &&
                ballDX > 0
              ) {
                ballX = cW - PAD_GAP - PAD_W - ballR;
                const rel = (ballY - (p2Y + padH / 2)) / (padH / 2);
                const spd = Math.sqrt(ballDX * ballDX + ballDY * ballDY) * 1.04;
                const ang = (rel * 60 * Math.PI) / 180;
                ballDX = -Math.abs(spd * Math.cos(ang));
                ballDY = spd * Math.sin(ang);
              }

              // scoring
              if (ballX < 0) {
                score2++;
                updateScore();
                resetBall();
              } else if (ballX > cW) {
                score1++;
                updateScore();
                resetBall();
              }

              draw();
              if (running) raf = requestAnimationFrame(loop);
            }

            startBtn.addEventListener("click", () => {
              running = false;
              if (raf) cancelAnimationFrame(raf);
              score1 = 0;
              score2 = 0;
              updateScore();
              resizeCanvas();
              initGame();
              draw();
              running = true;
              startBtn.textContent = "Reset";
              raf = requestAnimationFrame(loop);
            });

            // stop game and clean up listeners when window closes
            win.querySelector(".win-close").addEventListener("click", () => {
              running = false;
              if (raf) cancelAnimationFrame(raf);
              document.removeEventListener("keydown", onKeyDown);
              document.removeEventListener("keyup", onKeyUp);
            });
          },
        });
      }

        function getPainting(profile, temperature, weatherCode) {
          /*
           * La recomendación depende directamente del clima actual.
           * No es aleatoria: cada condición meteorológica tiene
           * una selección de pinturas coherente con el ambiente.
           */
          const options = PAINTINGS[profile] || PAINTINGS.cloudy;

          // Elegimos de forma estable una pintura según la temperatura
          // y el código meteorológico para que la recomendación pueda
          // cambiar cuando realmente cambie el clima.
          const seed = Math.abs(
            Math.round(Number(temperature) * 10) + Number(weatherCode || 0),
          );

          return options[seed % options.length];
        }

        function cityFromInput(value) {
          const query = value.trim().toLowerCase();
          if (!query) return null;

          return (
            CITIES.find(
              (city) =>
                city.name.toLowerCase() === query ||
                city.name.toLowerCase().includes(query),
            ) || null
          );
        }

            "</div>" +
            "</div>" +
            '<div style="display:flex;justify-content:space-between;align-items:center;font-size:9px;opacity:.75;">' +
            '<span id="waStatus">API: esperando</span>' +

            "</div>" +
            "</div>",

          onReady: function (win) {
            const input = win.querySelector("#waCityInput");
            const search = win.querySelector("#waSearch");
            const refresh = win.querySelector("#waRefresh");
            const result = win.querySelector("#waResult");
            const status = win.querySelector("#waStatus");
            const buttons = win.querySelectorAll(".wa-city-btn");

            let selectedCity = CITIES[0];

                message +

              selectedCity = city;
              input.value = city.name;

              result.innerHTML =
                '<div style="text-align:center;padding:28px 5px;">' +
                '<div style="font-size:22px;">↻</div>' +
                "<div>Consultando clima real...</div>" +

              const url =
                "https://api.open-meteo.com/v1/forecast" +
                "?latitude=" +
                city.lat +
                "&longitude=" +
                city.lon +
                "&current=temperature_2m,relative_humidity_2m,apparent_temperature," +
                "precipitation,weather_code,cloud_cover,wind_speed_10m" +
                "&temperature_unit=celsius" +
                "&wind_speed_unit=kmh" +

            refresh.addEventListener("click", function () {

            buttons.forEach(function (button) {

                const index = Number(button.dataset.index);
                loadWeather(CITIES[index]);
              });
            });

            // Bogotá por defecto.
            loadWeather(CITIES[0]);
          },
        });
      }
